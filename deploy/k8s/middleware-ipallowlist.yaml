# deliberately disabled — dashboard is intentionally internet-open (read-only); apply + add to
# ingress annotations to restrict.
#
# This file is NOT listed in kustomization.yaml and is NOT referenced by ingress.yaml, so
# `make deploy` never applies it. It lives here so the restriction is one command away rather
# than a thing to reinvent under pressure.
#
# The dashboard exposes no mutating endpoints — it renders telemetry the PS5 already broadcast
# on the LAN. The read-only invariant is what makes leaving it internet-open acceptable; if a
# write path (setup editing, session deletion, an auth'd admin view) is ever added, turn this
# on in the same change.
#
# To enable:
#   kubectl --context k3s-cluster-lan apply -f deploy/k8s/middleware-ipallowlist.yaml
#   # then add to ingress.yaml metadata.annotations (namespace-name@kubernetescrd is the
#   # cluster's existing reference convention, cf. allpets-backend-redirect-https@kubernetescrd):
#   traefik.ingress.kubernetes.io/router.middlewares: f126-ipallowlist@kubernetescrd
#   kubectl --context k3s-cluster-lan apply -k deploy/k8s
#
# Note: with Traefik behind no external proxy on this cluster, the client IP Traefik sees is
# the real remote address, so sourceRange matches directly and ipStrategy tuning is unneeded.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ipallowlist
  namespace: f126
  labels:
    app.kubernetes.io/name: f126
    app.kubernetes.io/part-of: f126-race-engineer
spec:
  ipAllowList:
    sourceRange:
      - <LAN_CIDR>    # home LAN (cluster node, PS5, desktops)
      - 100.64.0.0/10   # Tailscale CGNAT range
