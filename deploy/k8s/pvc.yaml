# Raw .f1raw capture files (zstd-compressed) + anything else the app writes under /data.
# local-path is node-local on cluster: the volume is bound to the single node, which is fine
# for a single-node cluster and matches replicas:1 + Recreate.
#
# local-path does NOT support volume expansion (allowVolumeExpansion=false), so 50Gi cannot be
# grown in place later — resizing means creating a new PVC and copying. Sized generously up
# front for that reason.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: f126-data
  namespace: f126
  labels:
    app.kubernetes.io/name: f126
    app.kubernetes.io/part-of: f126-race-engineer
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
