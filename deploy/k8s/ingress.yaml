# PLACEHOLDER HOST — race.example.com is not a real address.
#
# This base is environment-agnostic on purpose: the real hostname lives in a
# gitignored kustomize overlay (deploy/local/) that patches the three fields
# below. See deploy/k8s/README.md for the pattern and a copy-paste overlay.
#
# Conventions this file follows, which you may want to match to the rest of your
# cluster rather than to this repo:
#   * ingressClassName: traefik
#   * cert-manager.io/cluster-issuer: letsencrypt-cloudflare  (DNS-01 via Cloudflare —
#     rename to whatever ClusterIssuer you actually have; a DNS-01 issuer is required
#     if the host is not publicly reachable on :80 for an HTTP-01 challenge)
#   * TLS secretName = the host with dots replaced by dashes, suffixed -tls
#     (race.example.com -> race-example-com-tls)
#
# WebSockets (/ws) need NO extra annotations: Traefik proxies the Upgrade handshake natively,
# unlike nginx-ingress which needs proxy-read-timeout tuning.
#
# Deliberately NOT referencing any Traefik middleware — see middleware-ipallowlist.yaml for
# the opt-in IP restriction, which is disabled by design.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: f126-ingress
  namespace: f126
  labels:
    app.kubernetes.io/name: f126
    app.kubernetes.io/part-of: f126-race-engineer
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  rules:
    - host: race.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: f126
                port:
                  number: 8000
  tls:
    - hosts:
        - race.example.com
      secretName: race-example-com-tls
