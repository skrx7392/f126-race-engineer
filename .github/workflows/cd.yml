# CD — build and publish the container image to GHCR on every merge to main.
#
# There is NO deploy step, by design (decisions.md): cluster is a single node that also has to
# be free for actual racing, so deploys are a deliberate manual act — `make deploy` — not a
# side effect of merging. CI publishes the artifact; a human chooses when it goes live.
#
# SHARED DESIGN CONSTRAINT (see backend-ci.yml for the full rationale):
#   "Required-check-safe path filtering." The path check is the first STEP and heavy steps skip
#   individually, so the job always concludes `success` rather than never reporting. This
#   workflow is push-to-main only and can never be a PR required check, but it keeps the same
#   shape so all three files read identically and it stays required-safe if that ever changes.

name: cd

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual lever — added during the 2026-08-06 Actions outage

# Minimal default scope. Write access is granted per-job, below.
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  # Never cancel a publish mid-flight — a half-pushed set of layers is worse than a slow queue.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/skrx7392/f126-race-engineer

jobs:
  image:
    name: build & push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect image-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'src/**'
              - 'frontend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'deploy/Dockerfile'
              - '.dockerignore'
              - '.github/workflows/cd.yml'

      - name: Docs-only change — skipping build (conclusive no-op)
        if: steps.filter.outputs.image != 'true'
        run: echo "Nothing that lands in the image changed. Reporting success without a push."

      - name: Set up Buildx
        if: steps.filter.outputs.image == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow-scoped token, with packages:write from the job permissions above.
          # No PAT to rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        if: steps.filter.outputs.image == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` for convenience (what deploy/k8s defaults to) and an immutable
          # sha-<shortsha> for reproducible/pinned deploys and rollbacks.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        if: steps.filter.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # cluster is amd64 and it is the only deploy target — building arm64 too would
          # roughly double CI time for an image nothing would ever pull.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend: keeps the uv sync and npm ci layers warm between
          # merges, so a source-only change rebuilds in well under a minute.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false   # keeps the GHCR package page a plain image, not an index

      - name: Summary
        if: steps.filter.outputs.image == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Deploy it with: \`make deploy IMAGE_TAG=sha-\$(git rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
