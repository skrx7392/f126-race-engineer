# Frontend CI — svelte-check + unit tests + production build.
#
# SHARED DESIGN CONSTRAINT (see backend-ci.yml for the full rationale):
#   "Required-check-safe path filtering." This workflow ALWAYS triggers on pull_request and on
#   push to main; the path check is the first STEP, and when frontend/ is untouched every
#   heavy step is skipped individually so the job still concludes `success`. Workflow-level
#   `on.*.paths` filters are avoided because they create no check run at all, which deadlocks
#   any branch protection rule that requires this check.

name: frontend-ci

on:
  workflow_dispatch: {}  # manual lever — Actions outage fallback
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
        # working-directory does not apply to actions, only to `run:` steps — checkout still
        # lands at the repo root as normal.

      - name: Detect frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

      - name: No frontend changes — skipping (conclusive no-op)
        if: steps.filter.outputs.frontend != 'true'
        # Runs from the repo root: frontend/ may not exist yet on an early commit, and
        # working-directory is resolved before the shell runs.
        working-directory: .
        run: echo "No changes under frontend/. Reporting success."

      - name: Set up Node
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        # npm ci, not npm install: fails on a lockfile that disagrees with package.json
        # instead of quietly rewriting it.
        run: npm ci

      - name: Type/template check (svelte-check)
        if: steps.filter.outputs.frontend == 'true'
        run: npm run check

      - name: Test
        if: steps.filter.outputs.frontend == 'true'
        run: npm test

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        # Catches what `check` cannot: bundler resolution errors, missing assets, and anything
        # that only fails under a production Vite build.
        run: npm run build
