[project]
name = "f126"
version = "0.1.0"
description = "Personal F1 race engineer: PS5 F1 25 (2026 Season Pack) UDP telemetry capture, live pit-wall dashboard, and analysis"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.40.0",
    "psycopg[binary]>=3.3.4",
    "zstandard>=0.25.0",
]

[project.scripts]
f126 = "f126.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "hypothesis>=6.130",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f126"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
